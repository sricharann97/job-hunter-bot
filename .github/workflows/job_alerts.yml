name: Job Alert Bot

on:
  schedule:
    - cron: '30 */3 * * *'   # Every 3 hours at :30 UTC = every 3 hours on IST clock
  workflow_dispatch:         # lets you trigger it manually to test

permissions:
  contents: write   # needed so the workflow can commit seen_jobs.json back

jobs:
  run-job-hunter:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      - name: Run job hunter script
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python job_hunter.py

      - name: Commit updated tracking file
        run: |
          git config user.name "job-hunter-bot"
          git config user.email "actions@github.com"
          git add seen_jobs.json
          git commit -m "Update job tracker [skip ci]" || echo "Nothing to commit"
          git push
